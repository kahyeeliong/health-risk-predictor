<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Risk Predictor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
</head>

<body>
  <div class="container">
    <header>
      <h1>Health Risk Predictor</h1>
      <p>Enter your health data to assess diabetes risk</p>
    </header>

    <main class="main-grid">
      <form id="riskForm" class="input-card">
        <label>Pregnancies: <input type="number" name="Pregnancies" required /></label>
        <label>Glucose: <input type="number" name="Glucose" required /></label>
        <label>Blood Pressure: <input type="number" name="BloodPressure" required /></label>
        <label>Skin Thickness: <input type="number" name="SkinThickness" required /></label>
        <label>Insulin: <input type="number" name="Insulin" required /></label>
        <label>BMI: <input type="number" step="0.1" name="BMI" required /></label>
        <label>Diabetes Pedigree Function: <input type="number" step="0.01" name="DiabetesPedigreeFunction" required /></label>
        <label>Age: <input type="number" name="Age" required /></label>
        <button type="submit">Predict Risk</button>
      </form>

      <section id="result" class="result-card">
        <div id="riskStatus" class="risk-status">
          <span class="circle" id="riskCircle"></span>
          <span id="riskText">🧪 Prediction will appear here...</span>
        </div>
        <p id="confidenceText"></p>
      </section>
    </main>

    <footer>
      <p>© 2025 Health Risk Predictor. Designed by Liong Kah Yee.</p>
    </footer>
  </div>

<script src="script.js"></script>

</body>
</html>
