<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Risk Predictor</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet"/>
</head>

<body>
  <header>
    <nav>
      <a href="#" class="logo">HealthPredictor</a>
    </nav>
  </header>

  <main>
    <section class="risk-form-container">
      <header>
        <h1>Health Risk Predictor</h1>
        <p>Enter your health data to see your diabetes risk prediction.</p>
      </header>

      <form id="riskForm" class="form-card">
        <div class="form-group">
          <label>Pregnancies:<input type="number" name="Pregnancies" min="0" required /> </label>
          <label>Glucose: <input type="number" name="Glucose" min="0" required /></label>
          <label>BloodPressure: <input type="number" name="BloodPressure" min="0" required /></label>
          <label>SkinThickness: <input type="number" name="SkinThickness" min="0" required /></label>
          <label>Insulin: <input type="number" name="Insulin" min="0" required /></label>
          <label>BMI: <input type="number" step="0.1" name="BMI" min="0" required /></label>
          <label>DiabetesPedigreeFunction: <input type="number" step="0.01" name="DiabetesPedigreeFunction" min="0" required /></label>
          <label>Age: <input type="number" name="Age" min="0" required /></label>
        </div>

        <button type="submit" class="submit-btn">Predict Risk</button>
      </form>

      <div id="result" class="result-display"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Health Risk Predictor. Designed by Liong Kah Yee.</p>
  </footer>

<script src="script.js"></script>

</body>
</html>
