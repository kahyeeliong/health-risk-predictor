name: Tests

# Runs the tests automatically every time code is pushed or a pull request is opened.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the Docker image
        run: docker build -t health-risk-predictor .
      - name: Start it and check it answers
        run: |
          docker run -d -p 8000:8000 health-risk-predictor
          sleep 5
          curl --fail http://localhost:8000/health
